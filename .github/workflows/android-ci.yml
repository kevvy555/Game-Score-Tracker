name: Android CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build pull-request debug APK
        if: github.event_name == 'pull_request'
        run: gradle assembleDebug --no-daemon

      - name: Upload pull-request debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: qwirkle-score-tracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Check release signing configuration
        if: github.event_name != 'pull_request'
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Permanent Android signing secrets are not configured yet; signed release build skipped."
          fi

      - name: Restore permanent release keystore
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qwirkle-release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/qwirkle-release.p12" >> "$GITHUB_ENV"

      - name: Build permanently signed release APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify permanent signing certificate
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-certs.txt"
          EXPECTED="b8a0fae6016dbca060b6f9278fd1f65613660531474f8c6f8e6c9de34c11c476"
          ACTUAL=$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2)}' "$RUNNER_TEMP/apk-certs.txt" | head -1)
          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::APK signing certificate does not match the permanent Qwirkle signing key."
            exit 1
          }

      - name: Name signed APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk Qwirkle-Score-Tracker-1.1.1.apk

      - name: Upload permanently signed APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qwirkle-score-tracker-1.1.1-signed
          path: Qwirkle-Score-Tracker-1.1.1.apk
          retention-days: 30
